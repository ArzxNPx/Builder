name: AI Upscale Worker

on:
  workflow_dispatch:
    inputs:
      image_url: { required: true }
      scale: { required: true }
      chat_id: { required: true }
      bot_token: { required: true }

jobs:
  upscale:
    runs-on: ubuntu-latest
    timeout-minutes: 15 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: node upscale.js
        env:
          SCALE: ${{ github.event.inputs.scale }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          BOT_TOKEN: ${{ github.event.inputs.bot_token }}
